name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test detector, scope, HTTP and reports
        run: python -m unittest discover -s tests -v
      - name: Check launchers match the scanner
        run: python scripts/check_release.py
      - name: Compile standalone scanner
        run: python -m py_compile phplume.py
      - name: Check POSIX launcher syntax
        if: runner.os != 'Windows'
        run: sh -n run.sh
      - name: Check PowerShell launcher syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/run.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
